spring:
  application:
    name: sendlt-test
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

sendlt:
  jwt:
    secret: test-secret-key-at-least-32-characters-long!!
    expiration-ms: 3600000
  actuator:
    secured: false

logging:
  level:
    org.hibernate.orm.connections.pooling: WARN
    org.springframework.web: WARN
