spring:
  application:
    name: sendlt
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: always

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.orm.connections.pooling: WARN
