spring:
  application:
    name: sendlt
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: always

sendlt:
  jwt:
    secret: ${SENDLT_JWT_SECRET:change-me-in-production-use-at-least-32-characters!!}
    expiration-ms: ${SENDLT_JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.orm.connections.pooling: WARN
